<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Valentine 💖</title>

<style>
body {
    margin:0;
    font-family:'Comic Sans MS',cursive;
    text-align:center;
    background: linear-gradient(135deg,#ff4d6d,#ff758f,#ff8fab,#ffc2d1);
    overflow:hidden;
}

/* flower overlay */
body::before {
    content:"🌹 🌸 🌺 🌹 🌸 🌺 🌹 🌸 🌺 🌹 🌸 🌺";
    position:absolute;
    font-size:40px;
    opacity:0.15;
    width:100%;
    height:100%;
    pointer-events:none;
}

.container {
    background: rgba(255,255,255,0.93);
    padding:40px;
    border-radius:20px;
    margin-top:5vh;
    display:inline-block;
    max-width:420px;
    position:relative;
}

button {
    padding:12px 25px;
    margin:10px;
    border-radius:12px;
    border:none;
    cursor:pointer;
}

#yesBtn { background:#ff4d6d; color:white; }
#noBtn { background:#777; color:white; }

img {
    max-width:250px;
    border-radius:15px;
}

#lyrics {
    color:#ff4d6d;
    margin-top:10px;
}

/* confetti */
.confetti {
    position:absolute;
    font-size:20px;
    animation:fall 3s linear infinite;
}

@keyframes fall {
    from { transform: translateY(-10vh); }
    to { transform: translateY(100vh); }
}

/* secret screen */
#secretSection {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(135deg,#8b0000,#b30000,#ff1a1a);
    color:white;
    text-align:center;
    padding-top:20vh;
    z-index:999;
}
</style>
</head>

<body>

<div class="container">
<button id="secretBtn" style="display:none; position:absolute; top:10px; right:10px; font-size:12px;">Secret 🤫</button>


<h1>Will you be my Valentine, Nawroj? 💖</h1>

<button id="yesBtn">YES 💘</button>
<button id="noBtn">NO 😢</button>

<div id="photoSection" style="display:none">

<h2>I love you so much ❤️</h2>

<div id="slideshow">
<img id="slideImg" src="us1.jpg">
</div>

<div id="loveQuestion">
<h2>How much do you love me? 😌</h2>

<button onclick="answer('noless')">no less 🫠</button>
<button onclick="answer('more')">more 💗</button>
<button onclick="answer('infinite')">more infinite ♾️</button>
<button onclick="answer('extreme')">extreme infinite 💋💋</button>

</div>

<div id="lyrics"></div>

</div>

</div>

<div id="secretSection">
<h1>YDo you wanna do Fucky Fucky??!!😋🫣</h1>
<button onclick="secretYes()" style="padding:15px 30px; font-size:20px;">YES 😌</button>
</div>

<audio id="music" src="love.mp3" loop></audio>
<audio id="secretMusic" src="careless.mp3"></audio>


<script>

let yesBtn=document.getElementById("yesBtn");
let noBtn=document.getElementById("noBtn");
let photoSection=document.getElementById("photoSection");
let music=document.getElementById("music");

let size=16;

noBtn.onclick=function(){
    size+=6;
    yesBtn.style.fontSize=size+"px";
};

yesBtn.onclick=function(){
    photoSection.style.display="block";

    let musicPlayer = document.getElementById("music");
    musicPlayer.currentTime = 0;
    musicPlayer.play().catch(()=>{});

    document.getElementById("secretBtn").style.display="block";

    startConfetti();
    startLyrics();
    startSlideshow();
};


function answer(type){
    if(type==="noless") alert("😞 Fuck u");
    if(type==="more") alert("waaaw, dont love me enough huh ☹️?");
    if(type==="infinite") alert("theres even further options to show ur love 🥹");
    if(type==="extreme") alert("AWWWWWWWWW… I knew it 😻");
}

function startConfetti(){
    for(let i=0;i<40;i++){
        let c=document.createElement("div");
        c.innerHTML="🎉";
        c.className="confetti";
        c.style.left=Math.random()*100+"vw";
        c.style.animationDuration=(Math.random()*2+2)+"s";
        document.body.appendChild(c);
    }
}

/* lyrics typing */
let text="You are my favorite place, my safe space, my forever ❤️";
let i=0;

function startLyrics(){
    let l=document.getElementById("lyrics");
    let interval=setInterval(()=>{
        l.innerHTML+=text.charAt(i);
        i++;
        if(i>=text.length) clearInterval(interval);
    },50);
}

/* slideshow */
let images=["us1.jpg","us2.jpg","us3.jpg","us4.jpg","us5.jpg"];
let index=0;

function startSlideshow(){
    setInterval(()=>{
        index=(index+1)%images.length;
        document.getElementById("slideImg").src=images[index];
    },5000);
}

/* secret */
let secretBtn=document.getElementById("secretBtn");
let secretSection=document.getElementById("secretSection");

secretBtn.onclick=function(){
    secretSection.style.display="block";

    let mainMusic = document.getElementById("music");
    mainMusic.pause();

    let secretMusic = document.getElementById("secretMusic");
    secretMusic.currentTime = 0;
    secretMusic.play().catch(()=>{});
}



function secretYes(){
    alert("Scheme...Horny ass🤭🥴");
}

</script>

</body>
</html>
